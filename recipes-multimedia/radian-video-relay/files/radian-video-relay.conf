[input]
# H.264 RTSP input published by the camera or upstream video service.
rtsp-url=rtsp://192.168.1.20:8554/test
protocol=tcp
latency-ms=100

[recording]
enabled=true
directory=/root/video_recorder/recordings
segment-seconds=300
maximum-storage-gb=10

[streaming]
# SRT caller URI, for example: srt://192.168.1.100:9000?mode=caller
enabled=false
srt-uri=srt://127.0.0.1:9000?mode=caller

[recovery]
reconnect-seconds=5
storage-check-seconds=30
