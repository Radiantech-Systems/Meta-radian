# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-radian"
BBFILE_PATTERN_meta-radian = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-radian = "6"

LAYERDEPENDS_meta-radian = "core"
LAYERSERIES_COMPAT_meta-radian = "scarthgap"
